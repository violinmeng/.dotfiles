onboarding = false

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+|"
split_horizontal = "prefix+-"
close_pane = "prefix+x"

[experimental]
# Forward and render Kitty graphics from applications such as Pi.
kitty_graphics = true

[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
